<h1 class=&quot;entry-title&quot;>World News Live Updates: कतर के रास लाफान धमाके में 12 भारतीयों की मौत, 66 लोग घायल</h1> </header>
<div class=&quot;page-content&quot;>
<h2>World News Live Updates:</h2>
<pre>कतर के सबसे बड़े प्राकृतिक गैस निर्यात टर्मिनल रास लाफेन क्षेत्र में जंग के समय ईरान ने भीषण हमला किया था जिससे पूरा प्लांट ठप हो गया था अब प्लांट को दोबारा शुरू करने के लिए कोशिश करने के दौरान भीषण विस्फोट गया जिसके बाद आग लग गई। इस धमाके के बाद  दोहा स्थित भारतीय दूतावास ने कहा कि कतर के रास लाफान में हुई घटना में 12 भारतीय नागरिकों की मौत हो गई थी और घायलों की हालत स्थिर है और उन्हें उचित चिकित्सा उपचार मिल रहा है। कतर के अधिकारियों ने पुष्टि करते हुए कहा कि हम शोक संतप्त परिवारों के प्रति अपनी गहरी संवेदना व्यक्त करते हैं और दिवंगत आत्माओं की शांति के लिए प्रार्थना करते हैं।</pre>
<figure aria-describedby=&quot;caption-attachment-1727378&quot; class=&quot;wp-caption aligncenter&quot; id=&quot;attachment_1727378&quot; style=&quot;width: 1200px&quot;><img alt=&quot;World News LIVE Updates&quot; class=&quot;wp-image-1727378&quot; data-ibsrc=&quot;https://punjabkesari.imagibyte.sortdcdn.net/wp-content/uploads/2026/05/World-News-LIVE-Updates-8.png?type=webp&amp;quality=80&quot; decoding=&quot;async&quot; height=&quot;700&quot; sizes=&quot;(max-width: 1200px) 100vw, 1200px&quot; src=&quot;https://punjabkesari.imagibyte.sortdcdn.net/wp-content/uploads/2026/05/World-News-LIVE-Updates-8.png?type=webp&amp;quality=80&quot; srcset=&quot;https://punjabkesari.imagibyte.sortdcdn.net/wp-content/uploads/2026/05/World-News-LIVE-Updates-8.png?type=webp&amp;quality=80 1200w, https://punjabkesari.imagibyte.sortdcdn.net/wp-content/uploads/2026/05/World-News-LIVE-Updates-8-300x175.png?type=webp&amp;quality=80 300w, https://punjabkesari.imagibyte.sortdcdn.net/wp-content/uploads/2026/05/World-News-LIVE-Updates-8-1024x597.png?type=webp&amp;quality=80 1024w, https://punjabkesari.imagibyte.sortdcdn.net/wp-content/uploads/2026/05/World-News-LIVE-Updates-8-768x448.png?type=webp&amp;quality=80 768w, https://punjabkesari.imagibyte.sortdcdn.net/wp-content/uploads/2026/05/World-News-LIVE-Updates-8-150x88.png?type=webp&amp;quality=80 150w&quot; width=&quot;1200&quot;/><figcaption class=&quot;wp-caption-text&quot; id=&quot;caption-attachment-1727378&quot;>World News LIVE Updates</figcaption></figure>
<h2>World News Live Updates</h2>
<p>ईरानी विदेश मंत्रालय के प्रवक्ता इस्माइल बगाई ने कहा कि 14 सूत्री MOU के तहत चल रही तकनीकी वार्ता के दौरान अमेरिकी राष्ट्रपति डोनाल्ड ट्रम्प द्वारा दी गई धमकियों के कारण स्विट्जरलैंड में अमेरिका, ईरान, कतर और पाकिस्तान के बीच चल रही बैठक स्थगित कर दी गई। ईरानी तेल बिक्री, जमे हुए परिसंपत्तियों पर बैन हटाना और होर्मुज में समुद्री सुरक्षा से जुड़े मुद्दों पर चर्चा जारी रही।</p>
<p><strong>देखते रहें विश्व की खबरों का लाइव अपडेट</strong>…</p>

ीदरलैंड, स्वीडन, नॉर्वे और इटली समेत पांच देशों की करेंगे यात्रा </p></div><div class=&quot;blog-content-card&quot; id=&quot;blog-container-151&quot;><span class=&quot;sortd-liveblog-indicator-incontent&quot;></span><h2 class=&quot;entry-title&quot;>रिपोर्ट में दावा किया गया कि UAE ने ईरान के लावान द्वीप पर किया हमला</h2><p class=&quot;indiv-card-date&quot;>May 12, 2026 7:50 am</p><p class=&quot;entry-liveblog-content&quot;>UAE ने अप्रैल में लावान द्वीप पर ईरान की तेल रिफाइनरी पर अटैक किया था।</p></div><div class=&quot;blog-content-card&quot; id=&quot;blog-container-152&quot;><span class=&quot;sortd-liveblog-indicator-incontent&quot;></span><h2 class=&quot;entry-title&quot;>UAE ने ईरान पर किए थे सीक्रेट अटैक</h2><p class=&quot;indiv-card-date&quot;>May 12, 2026 7:45 am</p><p class=&quot;entry-liveblog-content&quot;>UAE ने अपना बदला लेने के लिए ईरान पर किए सीक्रेट अटैक किए थे और तेल रिफाइनरी को निशाना बनाया था अब  रिपोर्ट में खुलासे हुए है.</p></div><div class=&quot;blog-content-card&quot; id=&quot;blog-container-153&quot;><span class=&quot;sortd-liveblog-indicator-incontent&quot;></span><h2 class=&quot;entry-title&quot;>हिजबुल्लाह का बड़ा दावा, लेबनान में इजराइली सैनिकों पर किया हमला</h2><p class=&quot;indiv-card-date&quot;>May 11, 2026 1:02 pm</p><p class=&quot;entry-liveblog-content&quot;>इजरायल और लेबनान के बीच भी जंग जारी है. इसी बीच हिजबुल्लाह ने दावा करते हुए कहा कि लेबनान में इजराइली सैनिकों पर हमला किया गया है. साथ ही दावा किया कि इजरायल का हेलिकॉप्टर ने घायलों को निकाला है.</p></div><div class=&quot;blog-content-card&quot; id=&quot;blog-container-154&quot;><span class=&quot;sortd-liveblog-indicator-incontent&quot;></span><h2 class=&quot;entry-title&quot;>ईरान और अमेरिका में बढ़ते तनाव के कारण कच्चे तेल की कीमत में उछाल दर्ज </h2><p class=&quot;indiv-card-date&quot;>May 11, 2026 12:57 pm</p><p class=&quot;entry-liveblog-content&quot;>ईरान और अमेरिका के बीच तनाव लगातार बढ़ता जा रहा है जिससे कच्चे तेल की कीमत में लगभग 4.11 प्रतिशत का उछाल दर्ज किया गया है और कीमत अब 105.45 रुपये प्रति बैरल तक पहुंच गया है.</p></div><div class=&quot;blog-content-card&quot; id=&quot;blog-container-155&quot;><span class=&quot;sortd-liveblog-indicator-incontent&quot;></span><h2 class=&quot;entry-title&quot;>जासूस के आरोप में ईरान में एक व्यक्ति को फांसी</h2><p class=&quot;indiv-card-date&quot;>May 11, 2026 12:55 pm</p><p class=&quot;entry-liveblog-content&quot;>ईरान में जासूसी के आरोप में एक व्यक्ति को फांसी दे दी है और माना जा रहा है कि इस व्यक्ति का कनेक्शन CIA- मोसाद से जुड़ा हुआ है.</p></div><div class=&quot;blog-content-card&quot; id=&quot;blog-container-156&quot;><span class=&quot;sortd-liveblog-indicator-incontent&quot;></span><h2 class=&quot;entry-title&quot;>मध्य कोलंबिया में कोयला खदान में विस्फोट</h2><p class=&quot;indiv-card-date&quot;>May 11, 2026 8:03 am</p><p class=&quot;entry-liveblog-content&quot;>मध्य कोलंबिया में एक कोयला खदान में हुए विस्फोट में चार मजदूरों की मौत हो गई, इससे पहले भी इसी तरह की एक घटना हुई थी जिसमें नौ लोगों की मौत हो गई थी.</p></div><div class=&quot;blog-content-card&quot; id=&quot;blog-container-157&quot;><span class=&quot;sortd-liveblog-indicator-incontent&quot;></span><h2 class=&quot;entry-title&quot;>सऊदी अरब खाड़ी देशों पर हमलों की निंदा की</h2><p class=&quot;indiv-card-date&quot;>May 11, 2026 8:03 am</p><p class=&quot;entry-liveblog-content&quot;>सऊदी अरब ने संयुक्त अरब अमीरात, कतर और कुवैत पर किए गए हमलों की निंदा की और खाड़ी देशों की सुरक्षा के लिए उठाए जा रहे उपायों में अपना समर्थन दोहराया है.</p></div><div class=&quot;blog-content-card&quot; id=&quot;blog-container-158&quot;><span class=&quot;sortd-liveblog-indicator-incontent&quot;></span><h2 class=&quot;entry-title&quot;>ईरान के यूरेनियम भंडारों पर अमेरिका की नजर</h2><p class=&quot;indiv-card-date&quot;>May 11, 2026 8:03 am</p><p class=&quot;entry-liveblog-content&quot;>ट्रम्प ने दावा किया कि अमेरिका ईरान के यूरेनियम भंडारों पर कड़ी निगरानी रख रहा है, और चेतावनी देते हुए कहा कि इन जगहों तक पहुंचने की कोशिश की तो अमेरिकी सेना उसे उड़ा देगी.</p></div></div> <div class=&quot;post-tags&quot; data-wpr-lazyrender=&quot;1&quot;>
