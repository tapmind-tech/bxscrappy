m&quot;,&quot;position&quot;:4,&quot;item&quot;:{&quot;name&quot;:&quot;GST rate cuts boost consumption, India set for steady growth: FinMin report&quot;}}]}</script><script type=&quot;application/ld+json&quot;>{&quot;@context&quot;:&quot;https://schema.org&quot;,&quot;@type&quot;:&quot;NewsArticle&quot;,&quot;mainEntityOfPage&quot;:&quot;https://www.business-standard.com/economy/news/gst-rate-cuts-boost-consumption-india-set-for-steady-growth-finmin-report-125112700524_1.html&quot;,&quot;inLanguage&quot;:&quot;en&quot;,&quot;headline&quot;:&quot;GST rate cuts boost consumption, India set for steady growth: FinMin report&quot;,&quot;description&quot;:&quot;The GST rate rationalisation gave a \&quot;measurable\&quot; boost to consumption, and the Indian economy is on a stable footing to navigate risks and maintain growth momentum through the current fiscal, a finance ministry report said on Thursday.&quot;,&quot;keywords&quot;:&quot;Goods and Services Tax, Modi administration, Taxation in India, Goods and services tax, Economy of India, Government & Government Finance (NEC), Government of India, finance ministry report, food inflation, Finance Ministry, national statistics office, e-way, India, Retail inflation, National Statistics Office&quot;,&quot;articleSection&quot;:&quot;News&quot;,&quot;url&quot;:&quot;https://www.business-standard.com/economy/news/gst-rate-cuts-boost-consumption-india-set-for-steady-growth-finmin-report-125112700524_1.html&quot;,&quot;image&quot;:&quot;https://bsmedia.business-standard.com/_media/bs/img/article/2025-06/19/full/1750272528-5276.jpg&quot;,&quot;datePublished&quot;:&quot;2025-11-27T14:52:09+05:30&quot;,&quot;dateModified&quot;:&quot;2025-11-27T14:53:09+05:30&quot;,&quot;articleBody&quot;:&quot;The GST rate rationalisation gave a &quot;measurable&quot; boost to consumption, and the Indian economy is on a stable footing to navigate risks and maintain growth momentum through the current fiscal, a finance ministry report said on Thursday.The Finance Ministry&#39;s Monthly Economic Review for October said that with inflationary pressures easing and recent tax reforms boosting household disposable incomes, the near-term consumption outlook appears increasingly positive.Retail inflation has reached an all-time low in the current series, dropping to 0.25 per cent in October 2025, down from 1.44 per cent in September 2025.The decline can largely be attributed to the complete impact of reduced GST rates, a favourable base effect, and significant falls in food inflation, the ministry said.&quot;The rationalisation of GST rates has provided a measurable boost to consumption, as reflected in the strengthening of high-frequency indicators, including higher e-way bill generation, record festive-season automobile sales, robust UPI transaction values, and a notable rise in tractor sales,&quot; said the October Monthly Economic Review.It said that these developments point to broad-based improvements in demand conditions across both urban and rural segments.&quot;The full impact of GST rationalisation on spending behaviour would become more evident over the next two quarters,&quot; it added.Effective September 22, the GST rates on about 375 items were slashed, making mass consumption items cheaper. Also, GST rates of 5, 12, 18, and 28 per cent have been clubbed into two rates of 5 per cent and 18 per cent, resulting in a reduced price of 99 per cent of daily use items.The finance ministry report said the external environment remains characterised by elevated trade policy uncertainty, though global pressures have moderated relative to earlier peaks.With regard to growth prospects, it said that various independent economic assessments place real GDP growth for Q2 FY26 in the range of 77.5 per cent, indicating continued strength in underlying economic activity.Overall, the economy enters the second half of FY26 on a stable footing, anchored by well-contained inflation, resilient domestic demand and supportive policy dynamics, even as global uncertainties warrant continued vigilance, it added.The National Statistics Office (NSO) is scheduled to release the Q2 (July-September) GDP growth data on November 28. Economic growth was at a 5-quarter high of 7.8 per cent in Q1.The finance ministry report further said that global uncertainties including shifting trade policies, geopolitical frictions, and financial market volatility pose potential headwinds to exports, capital flows, and investor sentiment.&quot;Notwithstanding these challenges, the confluence of well-anchored inflation expectations, sustained public capital expenditure, and firming rural and urban demand places the economy on a stable footing, positioning it to navigate emerging risks and preserve its growth momentum through the remainder of FY26,&quot; said the Monthly Economic Review.The report said that corporate performance remained healthy during the month, with sustained profitability and stable balance sheets. Domestic financial markets continue to draw strength from firm institutional participation.The report called for structural reforms to sustain and accelerate job creation in the economy.In a bid to reform the labour markets, the Government of India has implemented 4 Labour Codes: the Code on Wages, 2019; the Industrial Relations Code, 2020; the Code on Social Security, 2020; and the Occupational Safety, Health and Working Conditions Code, 2020, streamlining 29 prevailing labour laws.This historic move modernises labour regulations, moving beyond colonial-era structures, improves workers&#39; welfare, and aligns the labour ecosystem with the changing world of work. It lays the groundwork for a future-ready workforce and stronger, resilient industries, supporting labour reforms for Viksit Bharat @ 2047, the report added.&quot;,&quot;author&quot;:[{&quot;name&quot;:&quot;Press Trust of India&quot;,&quot;url&quot;:&quot;https://www.business-standard.com/author/press-trust-of-india&quot;,&quot;@type&quot;:&q  cent in September 2025</h2><div class=&quot;show-on-mobile&quot;><div class=&quot;stryadstp&quot;><span><small>Advertisement</small></span><div style=&quot;width: 300px; height: 250px;&quot;><div id=&quot;above_article_heading-0&quot;></div></div></div></div><div id=&quot;above_feature_image_banner-0&quot;></div><div class=&quot;MainStory_storyimage__qkAq3&quot;><div class=&quot;MainStory_positionrelative__jOIzS&quot;><i class=&quot;img-sizer&quot;></i><img alt=&quot;GDP, Economy, corporate earnings, Indian Economy, BS1000, Covid&quot; class=&quot;img-fluid w-100 lazy-img&quot; height=&quot;465&quot; src=&quot;https://bsmedia.business-standard.com/_media/bs/img/article/2025-06/19/full/1750272528-5276.jpg?im=FitAndFill=(826,465)&quot; title=&quot;GDP, Economy, corporate earnings, Indian Economy, BS1000, Covid&quot; width=&quot;826&quot;/><div class=&quot;MainStory_strlabel__iEDZ4&quot;></div></div><p class=&quot;MainStory_captiontext__pELgL captiontext&quot;>The finance ministry report said the external environment remains characterised by elevated trade policy uncertainty, though global pressures have moderated relative to earlier peaks</p></div><span class=&quot;MainStory_dtlauthinfo__u_CUx&quot;><a href=&quot;/author/press-trust-of-india&quot;><span class=&quot;font-bold&quot;>Press Trust of India</span></a><span style=&quot;color: rgb(178, 34, 34);&quot;> New Delhi </span></span><div class=&quot;MainStory_autdtl__BefDN&quot;><div class=&quot;MetaPost_storymeta__araBu storymeta&quot;><div class=&quot;meta-info&quot; data-expandedtime=&quot;Nov 27 2025 | 2:53 PM IST&quot; data-updatedlongtime=&quot;2:53 PM IST&quot; data-updatedtime=&quot;2025-11-27T14:53:09+05:30&quot;>3 min read  Last Updated : Nov 27 2025 | 2:53 PM IST</div><div class=&quot;MetaPost_metaactions__h2__T metaactions&quot;></div></div></div><div class=&quot;MainStory_storyautio__00zQV storyautio&quot;><h4>Listen to This Article</h4><div class=&quot;undefined audio-box&quot;></div></div><div class=&quot;MainStory_storycontent__Pe3ys storycontent&quot;><a href=&quot;https://www.google.com/preferences/source?q=business-standard.com&quot; style=&quot;text-decoration: none;&quot; target=&quot;_blank&quot;><div class=&quot;MainStory_storycontent__Pe3ys storycontent&quot;><div class=&quot;MainStory_dontMiss__v1yUg&quot;><p>Don't want to miss the best from <span>Business Standard?</span></p><img alt=&quot;&quot; src=&quot;/assets/web-assets/images/google_miss.svg&quot;/></div></div></a><div id=&quot;parent_top_div&quot; style=&quot;margin: 0px;&quot;><div id=&quot;between_article_content_1-0&quot; style=&quot;min-height: 250px;&quot;><div class=&quot;advertisement-bg storyadsprg&quot;></div></div><p>
	The GST rate rationalisation gave a &quot;measurable&quot; boost to consumption, and the Indian economy is on a stable footing to navigate risks and maintain growth momentum through the current fiscal, a finance ministry report said on Thursday.</p>
<p>
	The Finance Ministry's Monthly Economic Review for October said that with inflationary pressures easing and recent tax reforms boosting household disposable incomes, the near-term consumption outlook appears increasingly positive.</p>
<p>
	Retail inflation has reached an all-time low in the current series, dropping to 0.25 per cent in October 2025, down from 1.44 per cent in September 2025.</p>
<p>
	The decline can largely be attributed to the complete impact of reduced GST rates, a favourable base effect, and significant falls in food inflation, the ministry said.</p><span style=&quot;display: block; height: 1px;&quot;> </span><div id=&quot;between_article_content_2-0&quot; style=&quot;min-height: 250px;&quot;><div class=&quot;advertisement-bg storyadsprg&quot;></div></div>
<p>

<p>
	It said that these developments point to broad-based improvements in demand conditions across both urban and rural segments.</p>
<p>
	&quot;The full impact of GST rationalisation on spending behaviour would become more evident over the next two quarters,&quot; it added.</p>
<p>
	Effective September 22, the GST rates on about 375 items were slashed, making mass consumption items cheaper. Also, GST rates of 5, 12, 18, and 28 per cent have been clubbed into two rates of 5 per cent and 18 per cent, resulting in a reduced price of 99 per cent of daily use items.</p><div id=&quot;between_article_content_3-0&quot; style=&quot;min-height: 250px;&quot;><div class=&quot;advertisement-bg storyadsprg&quot;></div></div>
<p>
	The finance ministry report said the external environment remains characterised by elevated trade policy uncertainty, though global pressures have moderated relative to earlier peaks.</p>
<p>
	With regard to growth prospects, it said that various independent economic assessments place real GDP growth for Q2 FY26 in the range of 77.5 per cent, indicating continued strength in underlying economic activity.</p>
<p>
	Overall, the economy enters the second half of FY26 on a stable footing, anchored by well-contained inflation, resilient domestic demand and supportive policy dynamics, even as global uncertainties warrant continued vigilance, it added.</p>
<p>
	The National Statistics Office (NSO) is scheduled to release the Q2 (July-September) GDP growth data on November 28. Economic growth was at a 5-quarter high of 7.8 per cent in Q1.</p><div id=&quot;between_article_content_4-0&quot; style=&quot;min-height: 250px;&quot;><div class=&quot;advertisement-bg storyadsprg&quot;></div></div>
<p>
	The finance ministry report further said that global uncertainties including shifting trade policies, geopolitical frictions, and financial market volatility pose potential headwinds to exports, capital flows, and investor sentiment.</p>
<p>
	&quot;Notwithstanding these challenges, the confluence of well-anchored inflation expectations, sustained public capital expenditure, and firming rural and urban demand places the economy on a stable footing, positioning it to navigate emerging risks and preserve its growth momentum through the remainder of FY26,&quot; said the Monthly Economic Review.</p>
<p>
	The report said that corporate performance remained healthy during the month, with sustained profitability and stable balance sheets. Domestic financial markets continue to draw strength from firm institutional participation.</p><div id=&quot;between_article_content_5-0&quot; style=&quot;min-height: 250px;&quot;><div class=&quot;advertisement-bg storyadsprg&quot;></div></div>
<p>
	The report called for structural reforms to sustain and accelerate job creation in the economy.</p>
<p>
	In a bid to reform the labour markets, the Government of India has implemented 4 Labour Codes: the Code on Wages, 2019; the Industrial Relations Code, 2020; the Code on Social Security, 2020; and the Occupational Safety, Health and Working Conditions Code, 2020, streamlining 29 prevailing labour laws.</p>
<p>
	This historic move modernises labour regulations, moving beyond colonial-era structures, improves workers' welfare, and aligns the labour ecosystem with the changing world of work. It lays the groundwork for a future-ready workforce and stronger, resilient industries, supporting labour reforms for Viksit Bharat @ 2047, the report added.</p><div id=&quot;between_article_content_6-0&quot; style=&quot;min-height: 250px;&quot;><div class=&quot;advertisement-bg storyadsprg&quot;></div></div></div><div><p id=&quot;auto_disclaimer&quot; style=&quot;font-style: italic;&quot;>(Only the headline and picture of this report may have been reworked by the Business Standard staff; the rest of the content is auto-generated from a syndicated feed.)</p></div><div class=&quot;latestnews_stryalsoread__HlMna&quot;><div class=&quot;latestnews_recommendsection__1ZpG_ recommendsection&quot;><div class=&quot;latestnews_alsoreadheading__tScqk alsoreadheading&quot;><h3 class=&quot;section-title&quot;><span>More From This Section</span></h3></div><button class=&quot;latestnews_slidearrow__b6nPH prevBtn&quot; id=&quot;slide-arrow-next-other_section0&quot;></button><button class=&quot;latestnews_slidearrow__b6nPH latestnews_slidearrownxt__sEt76 nextBtn&quot; id=&quot;slide-arrow-prev-other_section0&quot;></button><div class=&quot;latestnews_scrollbarList__Lm9h4 ulContainer slides-container&quot; id=&quot;slides-container-other_section0&quot;><div class=&quot;d-flex cardlist storylatestnews latestnews_storylatestnews___5wnY slide-other_section0&quot;><a href=&quot;https://www.business-standard.com/economy/news/india-uae-review-fta-progress-discuss-market-access-data-sharing-125112700258_1.html&quot;><div class=&quot;alsoReadImage&quot; style=&quot;position: relative;&quot;><span style=&quot;box-sizing: border-box; display: inline-block; overflow: hidden; width: initial; height: initial; background: none; opacity: 1; border: 0px; margin: 0px; padding: 0px; position: relative; max-width: 100%;&quo le:italic; padding: 10px 10px 10px 0px;\&quot;\u003e\r\n\t\tThe finance ministry report said the external environment remains characterised by elevated trade policy uncertainty, though global pressures have moderated relative to earlier peaks\u003c/div\u003e\u003c/div\u003e&quot;,&quot;authorThumbnailUrl&quot;:&quot;&quot;,&quot;authorBigImageUrl&quot;:&quot;&quot;,&quot;allMappedCategories&quot;:[&quot;1020000000&quot;,&quot;1020100000&quot;,&quot;1020101000&quot;],&quot;articleCompanyMap&quot;:[],&quot;articleBreadCrumb&quot;:&quot;\u003cdiv class=\&quot;breadcrum\&quot;\u003e You are here: \u003ca href=\&quot;/\&quot; class=\&quot;bact\&quot;\u003eHome\u003c/a\u003e \u0026raquo; \u003ca href=\&quot;/economy\&quot; class=\&quot;bact\&quot;\u003eEconomy\u003c/a\u003e » \u003ca href=\&quot;/economy/news\&quot;\u003eNews\u003c/a\u003e\u003c/div\u003e&quot;,&quot;numOfArticlePages&quot;:&quot;1&quot;,&quot;linkedCatUrlList&quot;:[&quot;/economy/news&quot;,&quot;/economy/news&quot;,&quot;/economy&quot;],&quot;is_article_comments&quot;:0,&quot;meta_title&quot;:&quot;GST rate cuts boost consumption, India set for steady growth: FinMin report&quot;,&quot;meta_description&quot;:&quot;The GST rate rationalisation gave a \&quot;measurable\&quot; boost to consumption, and the Indian economy is on a stable footing to navigate risks and maintain growth momentum through the current fiscal, a finance ministry report said on Thursday.&quot;,&quot;meta_keywords&quot;:&quot;Goods and Services Tax, Modi administration, Taxation in India, Goods and services tax, Economy of India, Government \u0026 Government Finance (NEC), Government of India, finance ministry report, food inflation, Finance Ministry, national statistics office, e-way, India, Retail inflation, National Statistics Office&quot;,&quot;aboutRedBand&quot;:false,&quot;isWebExclusive&quot;:false,&quot;isPhotoPost&quot;:false,&quot;displayAuthorName&quot;:true,&quot;displayComment&quot;:true,&quot;disableComment&quot;:false,&quot;htmlContent&quot;:&quot;\u003cp\u003e\r\n\tThe GST rate rationalisation gave a \u0026quot;measurable\u0026quot; boost to consumption, and the Indian economy is on a stable footing to navigate risks and maintain growth momentum through the current fiscal, a finance ministry report said on Thursday.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tThe Finance Ministry\u0026#39;s Monthly Economic Review for October said that with inflationary pressures easing and recent tax reforms boosting household disposable incomes, the near-term consumption outlook appears increasingly positive.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tRetail inflation has reached an all-time low in the current series, dropping to 0.25 per cent in October 2025, down from 1.44 per cent in September 2025.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tThe decline can largely be attributed to the complete impact of reduced GST rates, a favourable base effect, and significant falls in food inflation, the ministry said.\u003c/p\u003e\r\n\u003cp\u003e\r\n\t\u0026quot;The rationalisation of GST rates has provided a measurable boost to consumption, as reflected in the strengthening of high-frequency indicators, including higher e-way bill generation, record festive-season automobile sales, robust UPI transaction values, and a notable rise in tractor sales,\u0026quot; said the October Monthly Economic Review.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tIt said that these developments point to broad-based improvements in demand conditions across both urban and rural segments.\u003c/p\u003e\r\n\u003cp\u003e\r\n\t\u0026quot;The full impact of GST rationalisation on spending behaviour would become more evident over the next two quarters,\u0026quot; it added.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tEffective September 22, the GST rates on about 375 items were slashed, making mass consumption items cheaper. Also, GST rates of 5, 12, 18, and 28 per cent have been clubbed into two rates of 5 per cent and 18 per cent, resulting in a reduced price of 99 per cent of daily use items.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tThe finance ministry report said the external environment remains characterised by elevated trade policy uncertainty, though global pressures have moderated relative to earlier peaks.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tWith regard to growth prospects, it said that various independent economic assessments place real GDP growth for Q2 FY26 in the range of 77.5 per cent, indicating continued strength in underlying economic activity.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tOverall, the economy enters the second half of FY26 on a stable footing, anchored by well-contained inflation, resilient domestic demand and supportive policy dynamics, even as global uncertainties warrant continued vigilance, it added.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tThe National Statistics Office (NSO) is scheduled to release the Q2 (July-September) GDP growth data on November 28. Economic growth was at a 5-quarter high of 7.8 per cent in Q1.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tThe finance ministry report further said that global uncertainties including shifting trade policies, geopolitical frictions, and financial market volatility pose potential headwinds to exports, capital flows, and investor sentiment.\u003c/p\u003e\r\n\u003cp\u003e\r\n\t\u0026quot;Notwithstanding these challenges, the confluence of well-anchored inflation expectations, sustained public capital expenditure, and firming rural and urban demand places the economy on a stable footing, positioning it to navigate emerging risks and preserve its growth momentum through the remainder of FY26,\u0026quot; said the Monthly Economic Review.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tThe report said that corporate performance remained healthy during the month, with sustained profitability and stable balance sheets. Domestic financial markets continue to draw strength from firm institutional participation.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tThe report called for structural reforms to sustain and accelerate job creation in the economy.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tIn a bid to reform the labour markets, the Government of India has implemented 4 Labour Codes: the Code on Wages, 2019; the Industrial Relations Code, 2020; the Code on Social Security, 2020; and the Occupational Safety, Health and Working Conditions Code, 2020, streamlining 29 prevailing labour laws.\u003c/p\u003e\r\n\u003cp\u003e\r\n\tThis historic move modernises labour regulations, moving beyond colonial-era structures, improves workers\u0026#39; welfare, and aligns the labour ecosystem with the changing world of work. It lays the groundwork for a future-ready workforce and stronger, resilient industries, supporting labour reforms for Viksit Bharat @ 2047, the report added.\u003c/p\u003e&quot;,&quot;relatedArticles&quot;:[{&quot;article_id&quot;:&quot;125112601292&quot;,&quot;article_url&quot;:&quot;/economy/news/review-medium-term-debt-target-make-it-more-ambitious-imf-to-centre-125112601292_1.html&quot;,&quot;heading1&quot;:&quot;Review medium-term debt target, make it more ambitious: IMF to Centre&quot;,&quot;sub_heading&quot;:&quot;In its Article 4 review, the Fund called for broader debt anchors, stronger state-level reforms and careful monitoring of tax cuts as India continues fiscal consolidation&quot;,&quot;article_options&quot;:&quot;4481296&quot;,&quot;published_date&quot;:&quot;1764175689&quot;,&quot;modification_date&quot;:&quot;1764179229&quot;,&quot;article_media_info&quot;:{&quot;thumbnail_relpath&quot;:&quot;/_media/bs/img/article/2025-10/14/thumb/&quot;,&quot;media_relpath&quot;:&quot;/_media/bs/img/article/2025-10/14/full/&quot;,&quot;media_name&quot;:&quot;1760431116-711.JPG&quot;,&quot;title&quot;:&quot;IMF&quot;,&quot;akamai_image_type&quot;:&quot;FitAndFill&quot;},&quot;article_extra_options&quot;:&quot;268599304&quot;,&quot;is_paid&quot;:&quot;N&quot;,&quot;relation_type&quot;:&quot;related&quot;},{&quot;article_id&quot;:&quot;125112601386&quot;,&q
