blog_article_url&quot;:&quot;&quot;,&quot;live_blog_article_heading&quot;:&quot;&quot;,&quot;is_live&quot;:&quot;N&quot;,&quot;is_breaking_news_show&quot;:&quot;N&quot;,&quot;is_auto_update&quot;:&quot;N&quot;,&quot;auto_data_update_time&quot;:&quot;30000&quot;,&quot;tax_calculator_homepage_img&quot;:&quot;/_media/bs/img/budget/tax-calculator-img-small-25.png&quot;,&quot;tax_calculator_img&quot;:&quot;/_media/bs/img/budget/tax-calculator-img-big-25.png&quot;,&quot;budget_details_heading&quot;:&quot;Union Budget 2025 Updates&quot;,&quot;budget_details_desc&quot;:&quot;\u003cdiv\u003e\r\n\t\u003cdiv\u003e\r\n\t\t\u003cb\u003e\u003cu\u003eUnion Budget 2025\u003c/u\u003e\u003c/b\u003e\r\n\t\t\u003cdiv\u003e\r\n\t\t\t\u0026nbsp;\u003c/div\u003e\r\n\t\t\u003cdiv\u003e\r\n\t\t\tFinance Minister Nirmala Sitharaman presented the Union Budget 2025-26 on February 1, outlining a roadmap for economic growth, social welfare, and technological advancement of the country. The budget places emphasis on agriculture, infrastructure, tax relief, digital transformation, defence modernisation, cybersecurity, and space exploration.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eMajor announcements at a glance:\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tHigher credit for farmers\u003cbr /\u003e\r\n\t\t\tTax relief for the middle class\u003cbr /\u003e\r\n\t\t\tRecord investments in healthcare and education\u003cbr /\u003e\r\n\t\t\tBoost to innovation and manufacturing\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eAgriculture and rural development\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tPrime Minister Dhan-Dhaanya Krishi Yojana \u0026ndash; Covers 100 districts to enhance agriculture productivity, irrigation, storage, and credit access.\u003cbr /\u003e\r\n\t\t\tMission for Aatmanirbharta in Pulses \u0026ndash; A six-year programme focused on Tur, Urad, and Masoor dal to achieve self-sufficiency.\u003cbr /\u003e\r\n\t\t\tVegetables \u0026amp; Fruits Programme \u0026ndash; Promotes production, efficient supply chains, and fair pricing for farmers.\u003cbr /\u003e\r\n\t\t\tMission for Cotton Productivity \u0026ndash; A five-year initiative to increase cotton yield through scientific advancements.\u003cbr /\u003e\r\n\t\t\tKisan Credit Card (KCC) Loan Limit Raised \u0026ndash; From Rs 3 lakh to Rs 5 lakh for farmers, fishermen, and dairy farmers.\u003cbr /\u003e\r\n\t\t\tNew Urea Plant in Assam \u0026ndash; 1.27 million metric tons annual production for domestic use.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eHealthcare\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tMedical College Expansion \u0026ndash; 10,000 new UG/PG seats in 2025-26, targeting 75,000 new seats over five years.\u003cbr /\u003e\r\n\t\t\tDay-Care Cancer Centres \u0026ndash; 200 centres to be established in 2025-26, with full coverage across all districts within three years.\u003cbr /\u003e\r\n\t\t\tSocial Security for Gig Workers \u0026ndash; Includes identity cards, e-Shram portal registration, and healthcare under PM Jan Arogya Yojana.\u003cbr /\u003e\r\n\t\t\tMedical Tourism \u0026amp; \u0026lsquo;Heal in India\u0026rsquo; \u0026ndash; Public-private partnerships to position India as a global healthcare hub.\u003cbr /\u003e\r\n\t\t\tBroadband for Primary Health Centres (PHCs) \u0026ndash; All rural PHCs to be connected under BharatNet.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eEducation and skilling\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t50,000 Atal Tinkering Labs \u0026ndash; To be set up in government schools over five years to promote STEM learning.\u003cbr /\u003e\r\n\t\t\tBroadband Connectivity for Schools \u0026ndash; Under BharatNet, all government secondary schools will be connected.\u003cbr /\u003e\r\n\t\t\tBharatiya Bhasha Pustak Scheme \u0026ndash; Digital books in Indian languages for school and higher education.\u003cbr /\u003e\r\n\t\t\t5 National Centres of Excellence for Skilling \u0026ndash; Focus on advanced manufacturing training through industry collaboration.\u003cbr /\u003e\r\n\t\t\tExpansion of IITs \u0026ndash; 6,500 more students to be accommodated, hostel expansion at IIT Patna.\u003cbr /\u003e\r\n\t\t\tCentre of Excellence in AI for Education \u0026ndash; Rs 500 crore allocation for AI-driven education research.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eTechnology and innovation\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tNational Geospatial Mission \u0026ndash; Modernisation of land records, urban planning, and infrastructure development.\u003cbr /\u003e\r\n\t\t\tDeep Tech Fund of Funds \u0026ndash; Rs 10,000 crore to support startups in AI, biotech, and space tech.\u003cbr /\u003e\r\n\t\t\tPM Research Fellowship \u0026ndash; 10,000 fellowships for IITs and IISc, with higher financial support.\u003cbr /\u003e\r\n\t\t\tGene Bank for Crops Germplasm \u0026ndash; A second gene bank to store 10 lakh plant varieties for food security.\u003cbr /\u003e\r\n\t\t\tNuclear Energy Expansion \u0026ndash; Rs 20,000 crore allocated for Small Modular Reactors (SMRs) as part of India\u0026rsquo;s 100 GW nuclear energy goal by 2047.\u003cbr /\u003e\r\n\t\t\tGyan Bharatam Mission \u0026ndash; Survey, digitisation, and conservation of over 1 crore ancient manuscripts.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eInfrastructure and urban development\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tUrban Challenge Fund \u0026ndash; Rs 1 trillion for smart city development, urban redevelopment, and water sanitation projects.\u003cbr /\u003e\r\n\t\t\t50-Year Interest-Free Loan to States \u0026ndash; Rs 1.5 trillion for state-level infrastructure development.\u003cbr /\u003e\r\n\t\t\tJal Jeevan Mission Extension \u0026ndash; Extended to 2028 to ensure 100 per cent rural tap water coverage.\u003cbr /\u003e\r\n\t\t\tPublic-Private Partnership (PPP) in Infrastructure \u0026ndash; Each ministry to develop a three-year PPP pipeline.\u003cbr /\u003e\r\n\t\t\tAsset Monetisation Plan \u0026ndash; Rs 10 trillion (2025-30) to fund new projects.\u003cbr /\u003e\r\n\t\t\tUDAN Regional Connectivity Scheme \u0026ndash; Expansion to 120 new destinations, 40 million passengers over the next 10 years.\u003cbr /\u003e\r\n\t\t\tGreenfield Airport in Bihar \u0026ndash; To supplement Patna and Bihta airports.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eTaxation and financial reforms\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tNo Income Tax for earnings up to Rs 12 lakh (Rs 12.75 lakh for salaried employees).\u003cbr /\u003e\r\n\t\t\tRevised Income Tax Slabs:\u003cbr /\u003e\r\n\t\t\tRs 0-4 lakh \u0026ndash; Nil\u003cbr /\u003e\r\n\t\t\tRs 4-8 lakh \u0026ndash; 5 per cent\u003cbr /\u003e\r\n\t\t\tRs 8-12 lakh \u0026ndash; 10 per cent\u003cbr /\u003e\r\n\t\t\tRs 12-16 lakh \u0026ndash; 15 per cent\u003cbr /\u003e\r\n\t\t\tRs 16-20 lakh \u0026ndash; 20 per cent\u003cbr /\u003e\r\n\t\t\tRs 20-24 lakh \u0026ndash; 25 per cent\u003cbr /\u003e\r\n\t\t\tAbove Rs 24 lakh \u0026ndash; 30 per cent\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tHigher TDS Exemption for Rent \u0026ndash; Threshold increased from Rs 2.4 lakh to Rs 6 lakh.\u003cbr /\u003e\r\n\t\t\tUpdated Return Filing Period Extended \u0026ndash; Taxpayers now have four years (instead of two) to correct filings.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eDefence and cybersecurity\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tContinued modernisation of armed forces under Atmanirbhar Bharat.\u003cbr /\u003e\r\n\t\t\tIncreased investment in AI-driven defence systems, cyber warfare capabilities, and advanced surveillance technologies.\u003cbr /\u003e\r\n\t\t\tNational Cybersecurity Mission Expansion \u0026ndash; Upgraded frameworks and Cyber Swachhta Kendra (Cyber Hygiene Initiative).\u003cbr /\u003e\r\n\t\t\tInvestment in AI-powered cybersecurity solutions, threat detection, and quantum encryption.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eEnergy and environment\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tNuclear Energy Expansion \u0026ndash; Rs 20,000 crore for Small Modular Reactors (SMRs), with at least five operational by 2033.\u003cbr /\u003e\r\n\t\t\tGreen Manufacturing \u0026ndash; Incentives for solar PV cells, EV batteries, electrolyzers, and wind turbines.\u003cbr /\u003e\r\n\t\t\tPower Sector Reforms \u0026ndash; States to receive 0.5 per cent of GSDP in additional borrowing for electricity distribution upgrades.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eState-specific allocations\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eBihar\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tGreenfield Airport to supplement Patna and Bihta airports.\u003cbr /\u003e\r\n\t\t\tWestern Koshi Canal Project \u0026ndash; Irrigation support for 50,000 hectares of farmland.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eUttar Pradesh\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tTop 50 Tourist Destination Development, focusing on Buddhist heritage sites.\u003cbr /\u003e\r\n\t\t\tMedical College Expansion \u0026ndash; New UG/PG seats to enhance healthcare education.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eMaharashtra\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tUrban Challenge Fund \u0026ndash; Mumbai, Pune, and Nagpur among key beneficiaries.\u003cbr /\u003e\r\n\t\t\tNuclear Energy Expansion \u0026ndash; Maharashtra expected to host at least five SMRs.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eTamil Nadu\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tShipbuilding Clusters \u0026ndash; Chennai and Coimbatore to benefit from incentives and credit support.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eGujarat\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tMaritime Development Fund \u0026ndash; Gujarat\u0026rsquo;s ports and shipping industry to receive significant investment.\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\t\u003cb\u003eNorth-East\u0026nbsp;\u003c/b\u003e\u003cbr /\u003e\r\n\t\t\t\u003cbr /\u003e\r\n\t\t\tNew Urea Plant in Assam \u0026ndash; 1.27 million tons capacity to support agricultural production.\u003c/div\u003e\r\n\t\t\u003cdiv\u003e\r\n\t\t\t\u0026nbsp;\u003c/div\u003e\r\n\t\u003c/div\u003e\r\n\u003c/div\u003e\r\n\u003cbr /\u003e\r\n&quot;,&quot;is_budget_day_show&quot;:&quot;N&quot;,&quot;tax_calculator_url&quot;:&quot;/finance/personal-finance/tax-calculator-tool&quot;,&quot;article_id&quot;:&quot;&quot;,&quot;is_video_ad&quot;:&quot;Y&quot;,&quot;app_breaking_news_is_live_blog&quot;:&quot;N&quot;,&quot;is_tax_calculator&quot;:&quot;Y&quot;,&quot;is_glossary&quot;:&quot;Y&quot;,&quot;is_trivia&quot;:&quot;Y&quot;,&quot;is_highlights&quot;:&quot;Y&quot;,&quot;is_faqs&quot;:&quot;Y&quot;,&quot;is_paid_amp_video_ad&quot;:&quot;Y&quot;,&quot;currentYear&quot;:&quot;2025&quot;}},&quot;additionalData&quot;:{&quot;specialCoverageData&quot;:{&quot;topicData&quot;:{&quot;18616&quot;:{&quot;topic_id&quot;:18616,&quot;profile_id&quot;:477,&quot;about_id&quot;:&quot;&quot;,&quot;about_name&quot;:&quot;&quot;,&quot;profile_title&quot;:&quot;Delhi blast&quot;,&quot;itemList&quot;:[{&quot;article_id&quot;:125112200595,&quot;heading1&quot;:&quot;Terror not linked to religion; people should not fall for narratives: BJP&quot;,&quot;sub_heading&quot;:&quot;Terrorists want chaos. They want mistrust. They want to weaken our social fabric. Giving this attack a communal colour is exactly what they want. We cannot allow that, Chowdhary said in a statement&quot;,&quot;content_type&quot;:&quot;online&quot;,&quot;arti
