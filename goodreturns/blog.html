te today bangalore, gold news today, current gold price, Gold price,gold rates, gold, silver, gold prices rally, gold rates rally, gold rates wedding season, gold prices wedding season, silver prices rally, silver rates rally, silver rates wedding season, silver prices wedding season, buy gold or silver, by gold, buy silver &quot;,
  &quot;articleBody&quot;:&quot;Gold rates in India continued their super rally for the second consecutive day on November 26. The 100-gram gold price has climbed by Rs 27,800 in 2 days in row, while 10 grams surged by Rs 2,780 in 24 carat. Meanwhile, 1Kg silver price in India also soared by a whopping Rs 6,000. One of the key reason why gold and silver rates are rising is the delayed release of US economic data which has reaffirmed hopes for rate cut from US Federal Reserve in December policy.Gold and silver ended the session close to two-week high as delayed US economic data boosted expectations of a December Fed rate cut. September retail sales grew just 0.2%, signalling softer consumer demand, while PPI figures aligned with expectations. Recent dovish remarks from Fed officials have further pushed market pricing for a 25 bps cut to over 80%, said Rahul Kalantri, VP Commodities, Mehta Equities.Another key driving factor is the dollar index which slipped below 100, lending additional support to bullion. However, analyst said, upside momentum in gold was limited amid easing geopolitical risk after Ukrainian authorities reportedly agreed to a roadmap to end the conflict with Russia.Gold Rates In India:24 Carat Gold Prices:On November 26, 10 grams gold price soared by Rs 870 to Rs 1,27,910, 100 grams climbed by Rs 8,700 to Rs 12,79,100, 8 grams jumped by Rs 696 to Rs 1,02,328 and 1 gram gold is up by Rs 87 to Rs 12,791.On the previous day, 100 grams and 10 grams gold prices were up by Rs 19,100 and Rs 1,910 respectively.Accordingly, from November 25-26, gold rates in 24 carat has skyrocketed by Rs 27,800 in 100 grams and up by Rs 2,780 in 10 grams.22 Carat Gold Prices:In case of 22 carat, 10 grams gold rate is at Rs 1,17,250, higher by Rs 800. Further, 100 grams gold in this carat surged by Rs 8,000 to Rs 11,72,500. Among the smaller grams, gold is up by Rs 640 to Rs 93,800 per 8 gram and higher by Rs 80 to Rs 11,725 per 1 gram.18 Carat Gold Prices:10 grams gold price in 18 carat surged by Rs 650 to Rs 95,930, while 100 grams gold zoomed by Rs 6,500 to Rs 9,59,300. Additionally, 8 grams and 1 gram gold rates soared by Rs 520 and Rs 65 to Rs 76,744 and Rs 9,593 respectively.Silver Rates In India:Silver rates have also seen a significant jump over two days straight. On November 26, 1KG silver price surged by Rs 2,000, which comes after Rs 4,000 upside on November 25. In these two days, 1Kg silver is up by Rs 6,000.Currently, 1Kg silver rate is at Rs 1,69,000, 100 grams at Rs 16,900, 10 grams at Rs 1,690 and the cheapest silver is of Rs 169 per 1 gram.Gold   Silver Rates Outlook:Looking ahead, Kalantri said,  Gold has support at $4100-4065 while resistance at $4170-4195. Silver has support at $51.00-50.65 while resistance is at $51.85-52.20. In INR gold has support at Rs1,24,350-1,23,580 while resistance at Rs1,25,850-1,26,500. Silver has support at Rs1,54,850-1,53,600 while resistance at Rs1,57,110, 1,58,000.MCX Gold Price + MCX Silver PriceAt the time of writing, MCX gold with December 2025 expiry, soared by Rs 718 or 0.6% to trade at Rs 1,25,943 per 10 grams. The bullion touched an intraday high of Rs 1,26,078 per 10 grams in the opening bell.BUY MCX Gold?As per analysts at Nirmal Bang, gold prices are expected to rise. One can buy at 124700 nbsp;with a stop loss of 124200. Prices are expected to test 125500-126200.Moreover, MCX silver performed at Rs 1,58,168 per 1Kg, up by Rs 1,847 or 1.2%. The silver is near its intraday high of Rs 1,58,293 per 1Kg.BUY MCX Silver?The analysts said, silver prices are expected to rise. One can buy at 156800 with a stop loss of 155000 for the target 159000-160700.Disclaimer: The views and recommendations expressed are solely those of the individual analysts or entities and do not reflect the views of Goodreturns.in or Greynium Information Technologies Private Limited (together referred as we). We do not guarantee, endorse or take responsibility for the accuracy, completeness or reliability of a 	function intersectionObserve() {
		// const adSlots = document.querySelectorAll('[id^=&quot;google_ads_iframe_&quot;]'); // Change selector as needed
		const adSlots = document.querySelectorAll(&quot;.oiadv div&quot;); // Change selector as needed
		adSlots.forEach((slot) => {
			if (!slot) return;
			const observer = new IntersectionObserver(
				(entries) => {
					entries.forEach((entry) => {
						if (entry.isIntersecting) {
							adSlots.forEach((slot) => {
								slot.classList.remove(&quot;stickyAdslot&quot;);
							});
							// Add sticky class
							slot.classList.add(&quot;stickyAdslot&quot;);

							// Remove it after 2 seconds
							setTimeout(() => {
								slot.classList.remove(&quot;stickyAdslot&quot;);
							}, 2000);

							// Optionally stop observing after first trigger
							// observer.unobserve(slot);
						}
					});
				},
				{
					threshold: 0.2, // 90% in view
				}
			);
			observer.observe(slot);
		});
	}

	function setUserCookie(name, value, expires, path, domain, secure = true) {

						date.setTime(date.getTime() + expires * 60 * 60 * 1000);
						cookie += &quot;; expires=&quot; + date.toUTCString();
					}
					if (path) {
						cookie += &quot;; path=&quot; + path;
					}
					if (domain) {

					}
					if (secure) {
						cookie += &quot;;Secure&quot;;
					}
					cookie += &quot;;SameSite=None&quot;;

					document.cookie = cookie;

	function getUserCookie(c_name) {
		var c_value = document.cookie;
		var c_start = c_value.indexOf(&quot; &quot; + c_name + &quot;=&quot;);
		if (c_start == -1) {
			c_start = c_value.indexOf(c_name + &quot;=&quot;);
		}
		if (c_start == -1) {
			c_value = null;
		} else {
			c_start = c_value.indexOf(&quot;=&quot;, c_start) + 1;
			var c_end = c_value.indexOf(&quot;;&quot;, c_start);
			if (c_end == -1) {
				c_end = c_value.length;
			}
			c_value = unescape(c_value.substring(c_start, c_end));
		}
		return c_value;
	}

n gold was limited amid easing geopolitical risk after Ukrainian authorities reportedly agreed to a roadmap to end the conflict with Russia.&quot;</p><div class=&quot;recommended_video&quot; id=&quot;recommended_video&quot;></div><h2><a href=&quot;https://www.goodreturns.in/gold-rates/&quot; target=&quot;_blank&quot; title=&quot;gold rates in india&quot;>Gold Rates In India</a>:</h2><h2>24 Carat Gold Prices:</h2><p>On November 26, 10 grams gold price soared by Rs 870 to Rs 1,27,910, 100 grams climbed by Rs 8,700 to Rs 12,79,100, 8 grams jumped by Rs 696 to Rs 1,02,328 and 1 gram gold is up by Rs 87 to Rs 12,791.</p><div class=&quot;oiad oiadv&quot; data-refreshed=&quot;0&quot; id=&quot;are-slot-3&quot;></div><p>On the previous day, 100 grams and 10 grams gold prices were up by Rs 19,100 and Rs 1,910 respectively.</p><div class=&quot;gd-article-related-wrapper&quot;><div class=&quot;gd-article-relatedheading&quot;>Recommended For You</div><div class=&quot;gd-article-related&quot;><div class=&quot;gd-article-relatedthumb&quot;><a aria-label=&quot;Must Read Article link&quot; class=&quot;oiHyperLink&quot; data-uparam=&quot;ref_source=GR-EN&amp;ref_medium=Article-Page&amp;ref_campaign=Deep-Links-DMP&amp;ref_content=1472329-p2&quot; href=&quot;https://www.goodreturns.in/news/big-jump-in-mumbai-gold-rate-today-rich-dad-poor-dad-author-urges-to-bet-in-gold-as-biggest-cras-1472281.html&quot;><picture><source srcset=&quot;https://images.goodreturns.in/webp/fit-in/200x113/img/2025/11/goldprice12-1764140539.jpg&quot;/><img alt=&quot;Big Jump In Mumbai Gold Rate Today, 'Rich Dad Poor Dad' Author Urges To Bet in Gold As ‘Biggest Crash’ Arrives&quot; class=&quot;deepLinkPromoImg ls-is-cached lazyloaded&quot; data-src=&quot;https://images.goodreturns.in/fit-in/200x113/img/2025/11/goldprice12-1764140539.jpg&quot; height=&quot;56&quot; loading=&quot;lazy&quot; pinger-seen=&quot;true&quot; title=&quot;Big Jump In Mumbai Gold Rate Today, 'Rich Dad Poor Dad' Author Urges To Bet in Gold As ‘Biggest Crash’ Arrives&quot; width=&quot;100&quot;/></picture></a></div><div class=&quot;gd-article-relatedtitle&quot;><a aria-label=&quot;Must Read Article link&quot; class=&quot;oiHyperLink&quot; data-uparam=&quot;ref_source=GR-EN&amp;ref_medium=Article-Page&amp;ref_campaign=Deep-Links-DMP&amp;ref_content=1472329-p2&quot; href=&quot;https://www.goodreturns.in/news/big-jump-in-mumbai-gold-rate-today-rich-dad-poor-dad-author-urges-to-bet-in-gold-as-biggest-cras-1472281.html&quot;>Big Jump In Mumbai Gold Rate Today, 'Rich Dad Poor Dad' Author Urges To Bet in Gold As ‘Biggest Crash’ Arrives</a></div></div></div><p>Accordingly, from November 25-26, gold rates in 24 carat has skyrocketed by Rs 27,800 in 100 grams and up by Rs 2,780 in 10 grams.</p><h2>22 Carat Gold Prices:</h2><p>In case of 22 carat, 10 grams gold rate is at Rs 1,17,250, higher by Rs 800. Further, 100 grams gold in this carat surged by Rs 8,000 to Rs 11,72,500. Among the smaller grams, gold is up by Rs 640 to Rs 93,800 per 8 gram and higher by Rs 80 to Rs 11,725 per 1 gram.</p><div class=&quot;refreshInarticleAd listical-ad-left inarticlead&quot; data-adval=&quot;1&quot; data-refreshed=&quot;0&quot; data-slno=&quot;0&quot; data-slotid=&quot;div-gpt-ad-1469424701139-100&quot; data-status=&quot;false&quot; id=&quot;ad0&quot;><div class=&quot;oi-axt&quot; data-elementid=&quot;100&quot; data-isbackfill=&quot;true&quot; id=&quot;div-gpt-ad-1469424701139-100&quot;></div></div><h2>18 Carat Gold Prices:</h2><p>10 grams gold price in 18 carat surged by Rs 650 to Rs 95,930, while 100 grams gold zoomed by Rs 6,500 to Rs 9,59,300. Additionally, 8 grams and 1 gram gold rates soared by Rs 520 and Rs 65 to Rs 76,744 and Rs 9,593 respectively.</p><div class=&quot;gd-article-related-wrapper&quot;><div class=&quot;gd-article-relatedheading&quot;>You May Also Like</div><div class=&quot;gd-article-related&quot;><div class=&quot;gd-article-relatedthumb&quot;><a aria-label=&quot;Must Read Article link&quot; class=&quot; 0, 100 grams at Rs 16,900, 10 grams at Rs 1,690 and the cheapest silver is of Rs 169 per 1 gram.</p><h2>Gold &amp; Silver Rates Outlook:</h2><p>Looking ahead, Kalantri said, &quot; Gold has support at $4100-4065 while resistance at $4170-4195. Silver has support at $51.00-50.65 while resistance is at $51.85-52.20. In INR gold has support at Rs1,24,350-1,23,580 while resistance at Rs1,25,850-1,26,500. Silver has support at Rs1,54,850-1,53,600 while resistance at Rs1,57,110, 1,58,000.&quot;</p><h2>MCX Gold Price + MCX Silver Price</h2><p>At the time of writing, MCX gold with December 2025 expiry, soared by Rs 718 or 0.6% to trade at Rs 1,25,943 per 10 grams. The bullion touched an intraday high of Rs 1,26,078 per 10 grams in the opening bell.</p><h2>BUY MCX Gold?</h2><p>As per analysts at Nirmal Bang, gold prices are expected to rise. One can buy at 124700 with a stop loss of 124200. Prices are expected to test 125500-126200.</p><p>Moreover, MCX silver performed at Rs 1,58,168 per 1Kg, up by Rs 1,847 or 1.2%. The silver is near its intraday high of Rs 1,58,293 per 1Kg.</p><h2>BUY MCX Silver?</h2><p>The analysts said, silver prices are expected to rise. One can buy at 156800 with a stop loss of 155000 for the target 159000-160700.</p><div id=&quot;article-social-promo&quot;><section><div class=&quot;gd-stayinformed-wrapper&quot;><div class=&quot;gd-stayinformed-title&quot;>Stay Informed with GoodReturns</div><div class=&quot;gd-stayinformed-details&quot;><ul><li><a href=&quot;https://www.instagram.com/goodreturns_in&quot;>Follow us on Instagram</a> for insightful financial news and market trends.</li><li><a href=&quot;https://www.facebook.com/goodreturns.in&quot;>Connect with us on Facebook</a> for timely market analysis and financial updates.</li><li><a href=&quot;https://www.youtube.com/channel/UCKYUA8d6iEU7ZCq5w-tqizQ&quot;>Subscribe to our YouTube Channel</a> for expert financial videos and guidance.</li><li><a href=&quot;https://x.com/GoodReturns_&quot;>Follow us function capitalizeFirstLetter(string) {
    return string.charAt(0).toUpperCase() + string.slice(1);
}

function displayProfileDetails(userFields) {
        var responsePayload = JSON.parse(userFields);
        if (document.querySelector(&quot;#firstname&quot;)) {
            const firstNameElement = document.querySelector(&quot;#firstname&quot;);
            const firstNameText = responsePayload.given_name ?? 'NA';
            const capitalizedFirstName = capitalizeFirstLetter(firstNameText);
            firstNameElement.innerHTML = capitalizedFirstName;
        }
        if (document.querySelector(&quot;#lastname&quot;)) {
            const lastNameElement = document.querySelector(&quot;#lastname&quot;);
            const lastNameText = responsePayload.family_name ?? 'NA';
            const capitalizedLastName = capitalizeFirstLetter(lastNameText);
            lastNameElement.innerHTML = capitalizedLastName;
        }
        if(document.querySelector(&quot;#emailaddress&quot;)){
            document.querySelector(&quot;#emailaddress&quot;).innerHTML=responsePayload.email ?? 'NA';
        }
        if(document.querySelector(&quot;#cityname&quot;)){
            document.querySelector(&quot;#cityname&quot;).innerHTML=responsePayload.city ?? 'NA';
        }
        if(document.querySelector(&quot;.selectage&quot;)){
            document.querySelector(&quot;.selectage&quot;).innerHTML=responsePayload.age || 'Select your Age Range';
        }
        if(document.querySelector(&quot;.selectgender&quot;)){
            var genderselected = responsePayload?.gender || 'Select your Gender';
            document.querySelector(&quot;.selectgender&quot;).innerHTML=capitalizeFirstLetter(genderselected);
        }
        if (document.querySelector('.oi-myprofile-genderlist')) {
            var genderval = responsePayload.gender ?? 'NA';
            const genderListItems = document.querySelectorAll('.oi-myprofile-genderlist li');
            const selectedGender = genderval;
            if(genderval=='NA'){
                genderListItems.forEach(function(li) {
                    li.classList.remove('active');
                });
            }else{
                genderListItems.forEach(function(li) {
                const genderAttributeValue = li.getAttribute('data-gender');
                    if (genderAttributeValue === selectedGender) {
                        li.classList.add('active');
                    }
                });
            }
        }
        if (!responsePayload.login_token) {
            var logid = responsePayload.id;
            if(logid){
                var apiUrl = 'https://users.oneindia.com/account/cms/userAuthentication.php?type=getUserKey&host='+host1+'&device='+device+'&login_id='+logid;
                fetch(apiUrl, {
                    method: 'GET',
                })
                .then(response => response.json())
                .then(data => {
                    if(data['msg']==1){
                        var finalData = data['result'];
                        responsePayload.login_token = finalData;
                        var finalLocalData = JSON.stringify(responsePayload);
                        //setCookieCommon(&quot;MSLUserData&quot;, finalLocalData, 10000000,'/','');
                        localStorage.setItem('MSLUserData', finalLocalData);
                    }
                })
                .catch(error => {
                    // Handle errors
                    console.error('Error:', error);
                });
            }
        }
        if(document.getElementById('profileicon')){
            document.getElementById('profileicon').style.display = 'none';
        }
        if(document.getElementById('profileiconactive')){
           document.getElementById('profileiconactive').style.display = 'inline-block';
        }
        /*if(host1=='www.oneindia.com'){
            if(responsePayload.email){
                uid2Integration(responsePayload.email);
            }
        }*/
    }
function inertUserDatainDB(userData) {
    const storedUserLocDataJson = localStorage.getItem('MSLUserLoc');
    if (storedUserLocDataJson) {
        const storedUserData = JSON.parse(storedUserLocDataJson);
        const userDataObject = JSON.parse(userData);
        userDataObject.city = storedUserData.city ?? 'NA';
        userDataObject.ip = storedUserData.ip ?? 'NA';
        userDataObject.state = storedUserData.State ?? 'NA';
        userDataObject.country = storedUserData.country ?? 'NA';
        userData = JSON.stringify(userDataObject);
    }
    var apiUrl = '/scripts/cms/controller.php?module=subscription&lang_type=' + htmlLang + '&device='+device+'&type=insertUserDetails';
    fetch(apiUrl, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: userData
    })
        .then(response => response.json())
        .then(data => {
            console.log(data);
            if(data && data['msg']=='updated'){
                
                if(document.querySelector(&quot;.selectgender&quot;)){
                    var selgender = data['gender'] || 'Select your Gender';
                    document.querySelector(&quot;.selectgender&quot;).innerHTML=capitalizeFirstLetter(selgender);
                }
                if (document.querySelector('.oi-myprofile-genderlist')) {
                    var genderval = data['gender'] ?? 'NA';
                    setTimeout(function() {
                        updateLocalStorage('gender',data['gender']);
                    },1000)
                    const genderListItems = document.querySelectorAll('.oi-myprofile-genderlist li');
                    const selectedGender = genderval;
                    if(genderval=='NA'){
                        genderListItems.forEach(function(li) {
                            li.classList.remove('active');
                        });
                    }else{
                        genderListItems.forEach(function(li) {
                        const genderAttributeValue = li.getAttribute('data-gender');
                            if (genderAttributeValue === selectedGender) {
                                li.classList.add('active');
                            }
                        });
                    }
                }
                if(document.querySelector(&quot;.selectage&quot;)){
                    document.querySelector(&quot;.selectage&quot;).innerHTML=data['age'] ?? 'Select your Age Range';
                    updateLocalStorage('age',data['age']);
                }
            }
        })
        .catch(error => {
            // Handle errors
            console.error('Error:', error);
        });
}
function displayProfileDetailsFromDB(login_id) {

            method: 'GET',

        .then(response => response.json())

            if(data['msg']==1){

                //setCookieCommon(&quot;MSLUserData&quot;, finalLocalData, 10000000,'/','');
                localStorage.setItem('MSLUserData', finalLocalData);
            }
        })
        .catch(error => {
            // Handle errors
            console.error('Error:', error);
        });
}

      function timeAgo(timestamp) {
    const now = new Date();
    const timeDifference = Math.floor((now - new Date(timestamp)) / 1000); // difference in seconds
    if (timeDifference < 60) return `${timeDifference} second${timeDifference !== 1 ? 's' : ''} ago`;
    const minutes = Math.floor(timeDifference / 60);
    if (minutes < 60) return `${minutes} minute${minutes !== 1 ? 's' : ''} ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours} hour${hours !== 1 ? 's' : ''} ago`;
    const days = Math.floor(hours / 24);
    if (days < 30) return `${days} day${days !== 1 ? 's' : ''} ago`;
    const months = Math.floor(days / 30);
    if (months < 12) return `${months} month${months !== 1 ? 's' : ''} ago`;
    const years = Math.floor(days / 365);
    return `${years} year${years !== 1 ? 's' : ''} ago`;
}

// Function to get the excluded article IDs from localStorage
function getExcludedIds() {
    const storedIds = localStorage.getItem('clearedArticleIds');
    let excludedIds = storedIds ? storedIds.split(',') : [];
    if (excludedIds.length > 30) {
        excludedIds = excludedIds.slice(-30);
        localStorage.setItem('clearedArticleIds', excludedIds.join(','));
    }
    return excludedIds;

// Function to fetch latest pushed articles and render them
function fetchAndRenderArticles(excludedIds) {
    const firstAPI = &quot;https://notification.oneindia.com/scripts/cms/subscriptionPage.php?module=getLatestPushedArticles&articleIds=&quot; + excludedIds;
    const secondAPIBase = &quot;https://rss.oneindia.com/scripts/cms/getArticleDetails.php?type=latest-articles&sitename=&quot;+window.location.hostname+&quot;&output=json&quot;;

    fetch(firstAPI, {
        method: &quot;POST&quot;,
    })
        .then((response) => response.text())
        .then((data) => {
            let myRecord = JSON.parse(data);
            if (myRecord && myRecord.length > 0) {
                // If less than 25 articles are fetched, calculate the remaining and fetch more
                if (myRecord.length < 25) {
                    const remainingLimit = 25 - myRecord.length;
                    fetch(`${secondAPIBase}&limit=${remainingLimit}`, { method: &quot;GET&quot; })
                        .then((secondResponse) => secondResponse.json())
                        .then((secondData) => {
                            if (secondData && secondData.length > 0) {
                                const mappedSecondData = mapSecondApiResponse(secondData);
                                // Combine both API results
                                const combinedRecords = [...myRecord, ...mappedSecondData];
                                const sortedRecords = sortByPushedDate(combinedRecords); // Sort by pushed_date
                                renderArticles(sortedRecords);
                            } else {
                                const sortedRecords = sortByPushedDate(myRecord);
                                renderArticles(sortedRecords); // Render only first API results
                            }
                        })
                        .catch((err) => {
                            console.error(&quot;Error fetching additional articles:&quot;, err);
                            const sortedRecords = sortByPushedDate(myRecord);
                            renderArticles(sortedRecords); // Render only first API results
                        });
                } else {
                    const sortedRecords = sortByPushedDate(myRecord);
                    renderArticles(sortedRecords); // Render all 25 articles from the first API
                }
            } else {
                // Fetch all 25 articles directly from the second API if no results in the first API
                fetch(`${secondAPIBase}&limit=25`, { method: &quot;GET&quot; })
                    .then((secondResponse) => secondResponse.json())
                    .then((secondData) => {
                        const mappedSecondData = mapSecondApiResponse(secondData);
                        const sortedRecords = sortByPushedDate(mappedSecondData);
                        renderArticles(sortedRecords);
                    })
                    .catch((err) => {
                        console.error(&quot;Error fetching articles from the second API:&quot;, err);
                        handleNoArticles(); // Handle no articles case
                    });
            }
        })
        .catch((err) => {
            console.error(&quot;Error fetching articles from the first API:&quot;, err);
            handleNoArticles(); // Handle no articles case
        });
}
function mapSecondApiResponse(secondData) {
    return secondData.map((item) => ({
        article_id: item.content_id, // Map &quot;content_id&quot; to &quot;article_id&quot;
        description: item.description,
        link: item.url, // Map &quot;url&quot; to &quot;link&quot;
        image: item.img_url, // Use &quot;img_url&quot; or fallback to &quot;image&quot;
        pushed_date: item.published_date, // Map &quot;published_date&quot; to &quot;pushed_date&quot;
        scheduled_date: &quot;0000-00-00 00:00:00&quot; // Default value since this field doesn't exist in the second API
    }));
}
function sortByPushedDate(records) {
    return records.sort((a, b) => new Date(b.pushed_date) - new Date(a.pushed_date));
}

            const articleId = this.getAttribute('data-article-id');
            let clearedIds = (localStorage.getItem('clearedArticleIds') || '').split(',').filter(id => id);
            if (!clearedIds.includes(articleId)) {

            }
            const updatedIds = clearedIds.slice(-30);
            localStorage.setItem('clearedArticleIds', updatedIds.join(','));
            window.location.href = this.getAttribute('href');
        });
    });

// Function to find the next static item for correct insertion based on the config
function findNextStaticItem(currentKey, jsonOrder, config, staticKeys) {
    let currentIndex = jsonOrder.indexOf(currentKey);
    for (let i = currentIndex + 1; i < jsonOrder.length; i++) {
        const nextKey = jsonOrder[i];
        if (staticKeys.includes(nextKey)) {
            return config[nextKey].id;
        }
    }
    return null;
}

function createFooterItems(config) {
    const footerUL = document.getElementById('footer-items');
    const staticKeys = ['home', 'notifications', 'profile', 'app'];
    const jsonOrder = Object.keys(config);
    var fragment = document.createDocumentFragment();

    // First, build the items and store them in an array with their correct position.
    let itemsArray = [];

    jsonOrder.forEach(key => {
        if (!staticKeys.includes(key)) {
            const item = config[key];
            if (item) {
                const li = document.createElement('li');
                li.id = item.id;

                const a = document.createElement('a');
                a.href = item.url === 'javascript:void(0);' ? 'javascript:void(0);' : item.url;
                a.dataset.tracker = item.tracker;
                
                if (item.campaign) {
                    a.setAttribute('data-urlCampaign', item.campaign);
                }
                if (item.target) {
                    a.target = item.target;
                }

                const iconSpan = document.createElement('span');
                iconSpan.className = item.class;
                if (item.icon) {
                    iconSpan.style.backgroundImage = `url(${item.icon})`;
                    iconSpan.style.backgroundRepeat = 'no-repeat';
                    if (domainmiddle === 'filmibeat') {
                        iconSpan.style.backgroundSize = 'contain';
                    }
                    iconSpan.style.backgroundPosition = '0 0';
                    iconSpan.style.width = item.width || '18px';
                }

                const labelSpan = document.createElement('span');
                labelSpan.className = 'flabel';
                labelSpan.textContent = item.label;
                
                a.appendChild(iconSpan);
                a.appendChild(labelSpan);

                if (item.badge) {
                    const badgeSpan = document.createElement('span');
                    badgeSpan.className = 'fshorts-new';
                    badgeSpan.textContent = item.badge;
                    a.appendChild(badgeSpan);
                }

                li.appendChild(a);

                // Store each item and its position in the order
                const nextStaticItem = findNextStaticItem(key, jsonOrder, config, staticKeys);
                itemsArray.push({ li, nextStaticItem });
            }
        }
    });

    // Sort the items based on the reference to the next static item
    itemsArray.forEach(({ li, nextStaticItem }) => {
        if (nextStaticItem) {
            const referenceNode = document.getElementById(nextStaticItem);
            if (referenceNode) {
                referenceNode.insertAdjacentElement('beforebegin', li);
            } else {
                console.error(`Element with ID ${nextStaticItem} not found.`);
            }
        } else {
            fragment.appendChild(li); // Append to fragment if no static items are ahead
        }
    });

    // Once all elements are processed, append the fragment to the DOM
    footerUL.appendChild(fragment);

    if (document.getElementById('oi-footer-sticky-wrapper')) {
        if(host1=='www.filmibeat.com'){
          document.getElementById('oi-footer-sticky-wrapper').classList.add('fbenglish');
        }else{
          document.getElementById('oi-footer-sticky-wrapper').classList.add(domainmiddle);
        }
        document.getElementById('oi-footer-sticky-wrapper').style.display = 'none';
    }

    if (document.getElementById('bottomAdWrapper')) {
        document.getElementById('bottomAdWrapper').classList.add('btmstkwdg');
    }
    if(document.querySelector('ins[id^=&quot;gpt_unit_/1008496/oi-320x50_0&quot;]')){
      document.querySelector('ins[id^=&quot;gpt_unit_/1008496/oi-320x50_0&quot;]').classList.add('btmstkwdg');
    }
    handleSpecialCases(config); // Handle dynamic updates for notifications/profile
}
